<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sub-container" id="output-screen">
            <div id="screen">

            </div>
        </div>
        ]<div class="sub-container" id="keypads">
            <button class="keys clear" value="clear">C</button>
            <button class="keys" value="()"></button>
            <button class="keys delete" value="%">DEL</button>
            <button class="keys operator" value="/">&#247;</button>
            <button class="keys number" value="7">7</button>
            <button class="keys number" value="8">8</button>
            <button class="keys number" value="9">9</button>
            <button class="keys operator" value="*">&#215;</button>
            <button class="keys number" value="4">4</button>
            <button class="keys number" value="5">5</button>
            <button class="keys number" value="6">6</button>
            <button class="keys operator" value="-">-</button>
            <button class="keys number" value="1">1</button>
            <button class="keys number" value="2">2</button>
            <button class="keys number" value=3>3</button>
            <button class="keys operator" value="+">+</button>
            <button class="keys"></button>
            <button class="keys number" value="0">0</button>
            <button class="keys number" value=".">.</button>
            <button class="keys finish" value="=">=</button>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
